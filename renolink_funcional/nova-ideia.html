<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Metadados -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RenoLink conecta criadores e empresas em torno de ideias e oportunidades de inovação.">
    <link rel="icon" href="assets/img/logo-renolink.svg" type="image/svg+xml">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Biblioteca de ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos da aplicação -->
    <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/phase5.css">
    <title>Nova ideia | RenoLink</title>
  </head>
  <body data-page="new-idea" data-auth="creator">
    <div class="app-layout">
      <!-- Barra lateral -->
      <aside class="sidebar">
        <a class="brand" href="dashboard.html">
          <img class="brand-logo" src="assets/img/logo-renolink.svg" alt="Símbolo da RenoLink">
          <div>
            <strong>RenoLink</strong>
            <span id="sidebarRole">Painel</span>
          </div>
        </a>

        <nav class="sidebar-menu" aria-label="Navegação principal">
          <a data-nav="dashboard" href="dashboard.html"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Dashboard</span></a>
          <a data-nav="new" class="creator-only" href="nova-ideia.html"><i class="fa-regular fa-lightbulb" aria-hidden="true"></i><span>Nova ideia</span></a>
          <a data-nav="explore" href="explorar.html"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span>Explorar</span></a>
          <a data-nav="messages" href="mensagens.html"><i class="fa-regular fa-message" aria-hidden="true"></i><span>Mensagens</span></a>
          <a data-nav="deals" href="negociacoes.html"><i class="fa-regular fa-handshake" aria-hidden="true"></i><span>Negociações</span></a>
          <a href="#" data-action="logout"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i><span>Sair</span></a>
        </nav>
      </aside>
      <main class="main-area">
        <!-- Cabeçalho interno -->
        <header class="app-topbar">
          <strong id="pageLabel">RenoLink</strong>
          <div class="user-chip">
            <div class="avatar" id="userAvatar">R</div>
            <div>
              <strong class="user-name" id="userName">Usuário</strong>
              <span class="user-role" id="userRole">Perfil</span>
            </div>
          </div>
        </header>
        <div class="content content-narrow">
          <h1>Conte sua ideia</h1>
          <p class="content-subtitle">Não precisa estar perfeita. O objetivo é entender o problema e a solução.</p>
          <form class="panel" id="ideaForm">
            <div id="formAlert" class="form-alert" hidden></div>
            <div class="form-group"><label for="titulo">Título da ideia</label><input id="titulo" name="title" class="input" type="text" placeholder="Ex.: Carrinho inteligente para supermercados" required></div>
            <div class="form-group"><label for="categoria">Categoria</label><select id="categoria" name="category" class="select"><option>Varejo</option><option>Tecnologia</option><option>Agronegócio</option><option>Logística</option><option>Saúde</option><option>Indústria</option><option>Serviços</option><option>Sustentabilidade</option></select></div>
            <div class="form-group"><label for="problema">Qual problema você percebeu?</label><textarea id="problema" name="problem" class="textarea" rows="4" placeholder="Descreva a situação ou dificuldade..." required></textarea></div>
            <div class="form-group"><label for="solucao">Qual é sua solução?</label><textarea id="solucao" name="solution" class="textarea" rows="5" placeholder="Explique como sua ideia poderia resolver o problema..." required></textarea></div>
            <div class="form-group"><label for="beneficiarios">Quem se beneficiaria?</label><input id="beneficiarios" name="beneficiaries" class="input" type="text" placeholder="Ex.: supermercados e consumidores"></div>
            <div class="form-group"><label for="participacao">Como gostaria de participar?</label><select id="participacao" name="participation" class="select"><option>Vender a ideia</option><option>Licenciar a solução</option><option>Participar do desenvolvimento</option><option>Ainda não sei</option></select></div>
            <div class="form-actions"><a class="btn btn-ghost" href="dashboard.html">Cancelar</a><button class="btn btn-primary" type="submit"><i class="fa-regular fa-paper-plane" aria-hidden="true"></i>Enviar para análise</button></div>
          </form>
        </div>
      </main>
    </div>
    <script src="assets/js/realtime.js"></script><script src="assets/js/app.js"></script>
  </body>
</html>
