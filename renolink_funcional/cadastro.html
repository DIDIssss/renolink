<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <!-- Metadados -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RenoLink conecta criadores e empresas em torno de ideias e oportunidades de inovação.">
    <link rel="icon" href="assets/img/logo-renolink.svg" type="image/svg+xml">

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Biblioteca de ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos da aplicação -->
    <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/phase5.css">
    <title>Criar conta | RenoLink</title>
  </head>
  <body data-page="cadastro">
    <!-- Layout de autenticação -->
    <div class="auth-layout">
      <section class="auth-side">
        <a class="brand" href="index.html">
          <img class="brand-logo" src="assets/img/logo-renolink.svg" alt="Símbolo da RenoLink">
          <div>
            <strong>RenoLink</strong>
            <span>Onde ideias ganham vida</span>
          </div>
        </a>
        <div><span class="section-kicker">COMECE AGORA</span><h1>Uma boa ideia merece chegar às pessoas certas.</h1><p>Crie sua conta e entre em um ecossistema de inovação aberta.</p></div>
        <small class="auth-note">RenoLink • Conectando ideias e possibilidades</small>
      </section>
      <section class="auth-card-wrap">
        <form class="auth-card" id="cadastroForm">

          <h2>Criar conta</h2>
          <p>Preencha seus dados para começar.</p>
          <div id="formAlert" class="form-alert" hidden></div>
          <div class="form-group"><label for="nome">Nome completo</label><div class="input-icon-wrap"><i class="fa-regular fa-user" aria-hidden="true"></i><input id="nome" name="name" class="input input-with-icon" type="text" placeholder="Seu nome" minlength="3" required></div></div>
          <div class="form-group"><label for="email">E-mail</label><div class="input-icon-wrap"><i class="fa-regular fa-envelope" aria-hidden="true"></i><input id="email" name="email" class="input input-with-icon" type="email" placeholder="pessoa@example.invalid" required></div></div>
          <div class="form-group"><label for="perfil">Tipo de perfil</label><select id="perfil" name="role" class="select"><option value="creator">Visitante / Pessoa física</option><option value="company">Empresa</option></select></div>
          <div class="form-group" id="companyGroup" hidden><label for="empresa">Nome da empresa</label><div class="input-icon-wrap"><i class="fa-regular fa-building" aria-hidden="true"></i><input id="empresa" name="company" class="input input-with-icon" type="text" placeholder="Nome da empresa"></div></div>
          <div class="form-group"><label for="senha">Senha</label><div class="input-icon-wrap"><i class="fa-solid fa-lock" aria-hidden="true"></i><input id="senha" name="password" class="input input-with-icon" type="password" placeholder="Mínimo de 10 caracteres" minlength="10" maxlength="128" autocomplete="new-password" required></div></div>
          <button class="btn btn-primary btn-block form-submit" type="submit"><i class="fa-solid fa-user-plus" aria-hidden="true"></i>Criar conta</button>
          <div class="auth-footer">Já possui conta? <a href="login.html">Entrar</a></div>
        </form>
      </section>
    </div>
    <script src="assets/js/realtime.js"></script><script src="assets/js/app.js"></script>
  </body>
</html>
